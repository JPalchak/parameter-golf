name: Repair Relay Luna Review

on:
  push:
    branches:
      - repair-relay-webmcp
    paths:
      - "repair-relay-webmcp-app/**"
      - ".github/workflows/repair-relay-luna.yml"
  pull_request:
    paths:
      - "repair-relay-webmcp-app/**"
      - ".github/workflows/repair-relay-luna.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    working-directory: repair-relay-webmcp-app

jobs:
  luna:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Run Luna adversarial review
        run: npm run luna
      - name: Publish Luna report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: repair-relay-luna-${{ github.run_number }}
          path: |
            repair-relay-webmcp-app/reports/luna-latest.md
            repair-relay-webmcp-app/reports/luna-latest.json
      - name: Update the recurring Luna review issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const title = '[Luna] Repair Relay recurring review';
            const report = fs.readFileSync('repair-relay-webmcp-app/reports/luna-latest.md', 'utf8');
            const body = `${report}\n\n---\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
