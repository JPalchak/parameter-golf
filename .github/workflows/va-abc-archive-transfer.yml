name: Temporary VA ABC archive transfer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download complete rate-limited archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            --output VA_ABC_Monthly_Discounts_Specials_Complete_Archive.zip \
            'https://deploy-preview-76--va-abc-spirits-hunter.netlify.app/VA_ABC_Monthly_Discounts_Specials_Complete_Archive.zip'
          test -s VA_ABC_Monthly_Discounts_Specials_Complete_Archive.zip

      - name: Validate ZIP and record checksum
        shell: bash
        run: |
          set -euo pipefail
          unzip -t VA_ABC_Monthly_Discounts_Specials_Complete_Archive.zip
          sha256sum VA_ABC_Monthly_Discounts_Specials_Complete_Archive.zip | tee SHA256SUMS.txt
          unzip -l VA_ABC_Monthly_Discounts_Specials_Complete_Archive.zip > ARCHIVE_CONTENTS.txt
          ls -lh VA_ABC_Monthly_Discounts_Specials_Complete_Archive.zip

      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: va-abc-monthly-discounts-specials-complete-archive
          path: |
            VA_ABC_Monthly_Discounts_Specials_Complete_Archive.zip
            SHA256SUMS.txt
            ARCHIVE_CONTENTS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
