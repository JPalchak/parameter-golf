name: Publish Repair Relay source

on:
  push:
    branches:
      - repair-relay-webmcp

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore: bootstrap Repair Relay publication'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-relay-webmcp
      - name: Expand verified source tree
        run: |
          unzip -qo repair-relay-source.zip
          rm repair-relay-source.zip
          rm .github/workflows/bootstrap-repair-relay.yml
      - name: Commit the public application
        run: |
          git config user.name "repair-relay-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Repair Relay WebMCP application"
          git push origin HEAD:repair-relay-webmcp
