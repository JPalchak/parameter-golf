name: Repair Relay CI

on:
  push:
    branches:
      - repair-relay-webmcp
    paths:
      - "repair-relay-webmcp-app/**"
      - ".github/workflows/repair-relay-ci.yml"
  pull_request:
    paths:
      - "repair-relay-webmcp-app/**"
      - ".github/workflows/repair-relay-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: repair-relay-webmcp-app

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run verify:repo

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-relay-browser-smoke
          path: repair-relay-webmcp-app/reports/browser-smoke.png
          if-no-files-found: ignore
